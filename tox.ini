# Flake8 doesn't believe in pyproject.toml.
[flake8]
# https://flake8.readthedocs.org/en/latest/
exclude=\
    venv*/*,\
    local/*,\
    docs/*,\
    build/*,\
    tests/apps/*,\
    .eggs/*,\
    .tox/*
max-complexity = 10
max-line-length = 119
ignore = E121,E123,E126,E226,E24,E704,W503,W504,C901


[tox]
envlist = flake8,check-manifest,towncrier-check,package,py{310,311,312,312,313,314,315}-pytest{7,8,9}
skip_missing_interpreters = true

[testenv]
deps =
    pytest7: pytest < 8
    pytest8: pytest < 9
    pytest9: pytest >= 9.0.0
    pytest-cov
commands =
    pytest -vv

[testenv:flake8]
skip_install = True
deps =
    flake8
commands = flake8 {posargs}

[testenv:towncrier{,-check}]
skip_install = True
deps =
    towncrier==24.8.0
commands =
    check: python -m towncrier.check --compare-with origin/main
    !check: python -m towncrier {posargs}

[testenv:package]
deps =
    build
    twine
commands =
    python -m build --sdist --wheel --outdir dist/ .
    python -m twine check dist/*

[testenv:publish]
skip_install = True
deps =
    wheel
    twine
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
commands =
    python -m twine upload dist/*
